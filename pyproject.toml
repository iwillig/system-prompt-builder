[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "system-prompt-builder"
version = "0.2.1"
description = "Compose reproducible system prompts from Markdown and reusable skills."
readme = "readme.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
keywords = ["agents", "llm", "prompts", "system-prompts"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "chevron>=0.14.0",
  "click>=8.1.8",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
eval = ["deepeval>=3", "llm>=0.27"]
llmlingua = ["llmlingua>=0.2.2"]

[project.urls]
Documentation = "https://www.iwillig.me/system-prompt-builder/"
Changelog = "https://github.com/iwillig/system-prompt-builder/blob/main/CHANGELOG.md"
Issues = "https://github.com/iwillig/system-prompt-builder/issues"
Repository = "https://github.com/iwillig/system-prompt-builder"

[project.scripts]
spb = "spb.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/spb"]

[tool.hatch.build.targets.sdist]
include = ["src/spb", "CHANGELOG.md", "LICENSE", "readme.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

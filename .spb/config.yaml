version: 1
project_name: system_prompt_builder
renders:
- prompt: .spb/prompts/project-assistant.md
  harness: pi_agent
links:
- source: .spb/build/pi_agent/project-assistant.compressed.md
  destination: .pi/SYSTEM.md
support_harness:
- pi_agent
tool_provider_metadata:
  pi_agent:
    tools:
    - name: read
      summary: Read a file, optionally selecting a line range.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: File path.
          offset:
            anyOf:
            - type: integer
            - type: 'null'
            description: First line to read, starting at 1.
          limit:
            anyOf:
            - type: integer
            - type: 'null'
            description: Maximum number of lines to return.
        required:
        - path
        additionalProperties: false
    - name: write
      summary: Create or overwrite a file.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: File path.
          content:
            type: string
            description: Complete file content.
        required:
        - path
        - content
        additionalProperties: false
    - name: edit
      summary: Apply exact replacements to one file.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: File path.
          edits:
            type: array
            description: Exact replacements to apply.
            items:
              type: object
              properties:
                oldText:
                  type: string
                  description: Unique text to replace.
                newText:
                  type: string
                  description: Replacement text.
              required:
              - oldText
              - newText
              additionalProperties: false
        required:
        - path
        - edits
        additionalProperties: false
    - name: bash
      summary: Execute a shell command.
      parameters:
        type: object
        properties:
          command:
            type: string
            description: Shell command.
          timeout:
            oneOf:
            - type: integer
              description: Timeout in seconds.
            - type: 'null'
        required:
        - command
        additionalProperties: false
    - name: grep
      summary: Search file contents for a pattern.
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: Regular expression or literal search pattern.
          path:
            type: string
            description: Directory or file to search.
          glob:
            type: string
            description: File glob filter.
          ignoreCase:
            type: boolean
            description: Use case-insensitive matching.
          literal:
            type: boolean
            description: Treat the pattern as a literal string.
          context:
            anyOf:
            - type: integer
            - type: 'null'
            description: Number of context lines around matches.
          limit:
            anyOf:
            - type: integer
            - type: 'null'
            description: Maximum number of matches.
        required:
        - pattern
        additionalProperties: false
    - name: find
      summary: Find files by glob pattern.
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: Glob pattern.
          path:
            type: string
            description: Directory to search.
          limit:
            type: integer
            description: Maximum number of results.
        required:
        - pattern
        additionalProperties: false
    - name: ls
      summary: List directory contents.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Directory path.
          limit:
            type: integer
            description: Maximum number of entries.
        required: []
        additionalProperties: false
    - name: fetch
      summary: Fetch a web URL as readable text.
      parameters:
        type: object
        properties:
          url:
            type: string
            description: HTTP or HTTPS URL.
        required:
        - url
        additionalProperties: false
    - name: ask_user
      summary: Ask the user a structured question.
      parameters:
        type: object
        properties:
          question:
            type: string
            description: Single question or heading for a batch.
          questions:
            type: array
            description: Two to four independent questions.
            items:
              type: object
              properties:
                question:
                  type: string
                  description: Question text.
                context:
                  type: string
                  description: Relevant decision context.
                options:
                  type: array
                  description: Selectable answers.
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                        description: Short option title.
                      description:
                        type: string
                        description: Option details.
                    required:
                    - title
                    additionalProperties: false
                allowMultiple:
                  type: boolean
                  description: Allow multiple selections.
                allowFreeform:
                  type: boolean
                  description: Allow a free-form answer.
              required:
              - question
              additionalProperties: false
            minItems: 2
            maxItems: 4
          context:
            type: string
            description: Relevant context for a single question.
          options:
            type: array
            description: Selectable answers.
            items:
              type: object
              properties:
                title:
                  type: string
                  description: Short option title.
                description:
                  type: string
                  description: Option details.
              required:
              - title
              additionalProperties: false
          allowMultiple:
            type: boolean
            description: Allow multiple selections.
          allowFreeform:
            type: boolean
            description: Allow a free-form answer.
          allowComment:
            type: boolean
            description: Allow an optional comment.
          displayMode:
            type: string
            description: Question display mode.
            enum:
            - overlay
            - inline
          singleSelectLayout:
            type: string
            description: Single-select layout.
            enum:
            - auto
            - list
          contextExpanded:
            type: boolean
            description: Show the full context by default.
          overlayToggleKey:
            type: string
            description: Keyboard shortcut for toggling the overlay.
          commentToggleKey:
            type: string
            description: Keyboard shortcut for the comment field.
          timeout:
            type: integer
            description: Auto-dismiss delay in milliseconds.
        required: []
        additionalProperties: false
    - name: memory_search
      summary: Search durable memory entries.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: Search terms or question.
          project:
            anyOf:
            - type: string
            - type: 'null'
            description: Project filter; null means global memories.
          target:
            type: string
            description: Memory target.
            enum:
            - memory
            - user
            - failure
            - project
          category:
            type: string
            description: Failure-memory category.
            enum:
            - failure
            - correction
            - insight
            - preference
            - convention
            - tool-quirk
          limit:
            type: integer
            description: Maximum results.
            minimum: 1
            maximum: 20
        required:
        - query
        additionalProperties: false
    - name: memory_add
      summary: Save durable information to memory.
      parameters:
        type: object
        properties:
          target:
            type: string
            description: Memory scope.
            enum:
            - memory
            - user
            - project
            - failure
          content:
            type: string
            description: Durable information to save.
          category:
            type: string
            description: Failure-memory category.
            enum:
            - failure
            - correction
            - insight
            - preference
            - convention
            - tool-quirk
          failure_reason:
            type: string
            description: Reason a failure occurred.
        required:
        - target
        - content
        additionalProperties: false
    - name: memory_replace
      summary: Replace a matching durable memory entry.
      parameters:
        type: object
        properties:
          target:
            type: string
            description: Memory scope.
            enum:
            - memory
            - user
            - project
            - failure
          old_text:
            type: string
            description: Text identifying the existing entry.
          content:
            type: string
            description: Replacement memory content.
        required:
        - target
        - old_text
        - content
        additionalProperties: false
    - name: memory_remove
      summary: Remove a matching durable memory entry.
      parameters:
        type: object
        properties:
          target:
            type: string
            description: Memory scope.
            enum:
            - memory
            - user
            - project
            - failure
          old_text:
            type: string
            description: Text identifying the entry to remove.
        required:
        - target
        - old_text
        additionalProperties: false
    - name: session_search
      summary: Search previous Pi sessions.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: Search query.
          project:
            type: string
            description: Project filter.
          role:
            type: string
            description: Message role filter.
            enum:
            - user
            - assistant
          limit:
            type: integer
            description: Maximum results.
            minimum: 1
            maximum: 20
          snippetChars:
            type: integer
            description: Maximum characters per result snippet.
            minimum: 100
            maximum: 4000
        required:
        - query
        additionalProperties: false
    - name: skill_manage
      summary: Manage reusable Pi agent skills.
      parameters:
        type: object
        properties:
          action:
            type: string
            description: Operation to perform.
            enum:
            - create
            - view
            - patch
            - update
            - edit
            - delete
          name:
            type: string
            description: Skill name for creation.
          skill_id:
            type: string
            description: Stable skill identifier.
          description:
            type: string
            description: Skill summary and discovery triggers.
          scope:
            type: string
            description: Storage scope.
            enum:
            - global
            - project
          section:
            type: string
            description: Section to patch.
          content:
            type: string
            description: Raw Markdown skill content.
          when_to_use:
            type: string
            description: When the procedure applies.
          procedure_steps:
            type: array
            description: Ordered procedure steps.
            items:
              type: string
          pitfalls:
            type: array
            description: Pitfalls to avoid.
            items:
              type: string
          verification_steps:
            type: array
            description: Steps that verify completion.
            items:
              type: string
        required:
        - action
        additionalProperties: false
    - name: codemode
      summary: Run JavaScript that calls available agent tools.
      parameters:
        type: object
        properties:
          script:
            type: string
            description: JavaScript source to execute.
        required:
        - script
        additionalProperties: false
    - name: list_mcp_resources
      summary: List resources exposed by MCP servers.
      parameters:
        type: object
        properties:
          server:
            type: string
            description: MCP server name.
          cursor:
            type: string
            description: Pagination cursor.
        required: []
        additionalProperties: false
    - name: list_mcp_resource_templates
      summary: List MCP resource templates.
      parameters:
        type: object
        properties:
          server:
            type: string
            description: MCP server name.
          cursor:
            type: string
            description: Pagination cursor.
        required: []
        additionalProperties: false
    - name: read_mcp_resource
      summary: Read an MCP resource.
      parameters:
        type: object
        properties:
          server:
            type: string
            description: MCP server name.
          uri:
            type: string
            description: Resource URI.
        required:
        - server
        - uri
        additionalProperties: false
    - name: mcp__symbolic__status
      summary: Report the active Symbolic parse or query phase.
      parameters:
        type: object
        properties: {}
        required: []
        additionalProperties: false
    - name: mcp__symbolic__search_functions
      summary: Find function definitions by name or identifier terms.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: Function name or identifier terms.
          path:
            type: string
            description: Project-relative search path.
          limit:
            type: integer
            description: Maximum results.
        required:
        - query
        additionalProperties: false
    - name: mcp__symbolic__search
      summary: Search indexed comments and Markdown prose.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: Search terms.
          path:
            type: string
            description: Search path.
          limit:
            type: integer
            description: Maximum results.
        required:
        - query
        additionalProperties: false
    - name: mcp__symbolic__schema
      summary: Read documented Symbolic predicate contracts.
      parameters:
        type: object
        properties:
          name:
            type: string
            description: Predicate name or name/arity.
        required: []
        additionalProperties: false
    - name: mcp__symbolic__query
      summary: Prove a Prolog goal against the loaded Symbolic facts.
      parameters:
        type: object
        properties:
          goal:
            type: string
            description: Prolog goal.
          limit:
            type: integer
            description: Maximum solutions.
          path:
            type: string
            description: Cached project path.
        required:
        - goal
        additionalProperties: false
    - name: mcp__symbolic__parse
      summary: Refresh the Symbolic scan for a project.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Project directory containing .symbolic/config.json.
          config_file:
            type: string
            description: Explicit .symbolic/config.json path.
        required: []
        additionalProperties: false
    - name: mcp__symbolic__overview
      summary: Report loaded Symbolic facts and scan status.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Cached project path.
        required: []
        additionalProperties: false
    - name: mcp__symbolic__extract
      summary: Extract a bounded claim from a sentence.
      parameters:
        type: object
        properties:
          sentence:
            type: string
            description: Sentence to analyze.
          model:
            type: string
            description: Optional model identifier.
        required:
        - sentence
        additionalProperties: false
    - name: mcp__symbolic__check
      summary: Check a claim against loaded Symbolic facts.
      parameters:
        type: object
        properties:
          sentence:
            type: string
            description: Claim to check.
          model:
            type: string
            description: Optional model identifier.
          path:
            type: string
            description: Cached project path.
        required:
        - sentence
        additionalProperties: false
    - name: mcp__symbolic__ask_catalog
      summary: List supported Symbolic natural-language questions.
      parameters:
        type: object
        properties: {}
        required: []
        additionalProperties: false
    - name: mcp__symbolic__ask
      summary: Answer a bounded question about the codebase.
      parameters:
        type: object
        properties:
          question:
            type: string
            description: Question about the loaded codebase.
          path:
            type: string
            description: Cached project path.
        required:
        - question
        additionalProperties: false
    - name: mcp__symbolic__analyze_text
      summary: Analyze English text and propose bounded query frames.
      parameters:
        type: object
        properties:
          text:
            type: string
            description: English text to analyze.
        required:
        - text
        additionalProperties: false
    - name: mcp__agent_browser__agent_browser_tools_profiles
      summary: List browser tool profiles and setup options.
      parameters:
        type: object
        properties:
          allowedDomains:
            type: array
            description: Restrict traffic to these domains.
            items:
              type: string
          caCert:
            type: string
            description: CA certificate or PEM bundle path.
          clearCaCert:
            type: boolean
            description: Clear retained CA trust.
          extraArgs:
            type: array
            description: Extra browser CLI arguments.
            items:
              type: string
          idleTimeout:
            type: string
            description: Daemon idle timeout.
          namespace:
            type: string
            description: Isolated daemon namespace.
          restore:
            oneOf:
            - type: boolean
              description: Restore saved state.
            - type: string
              description: Named saved-state key.
          restoreCheckFn:
            type: string
            description: JavaScript expression that must be true after restore.
          restoreCheckText:
            type: string
            description: Text that restored page must contain.
          restoreCheckUrl:
            type: string
            description: URL pattern that restored page must match.
          restoreSave:
            type: string
            description: Saved-state policy.
            enum:
            - auto
            - always
            - never
          session:
            type: string
            description: Isolated browser session name.
          timeoutMs:
            type: integer
            description: Tool timeout in milliseconds.
            minimum: 1
          useSystemCa:
            type: boolean
            description: Use the operating-system CA store for CLI HTTPS requests.
        required: []
        additionalProperties: false
    - name: mcp__agent_browser__agent_browser_open
      summary: Open a browser and optionally navigate to a URL.
      parameters:
        type: object
        properties:
          allowedDomains:
            type: array
            description: Restrict traffic to these domains.
            items:
              type: string
          caCert:
            type: string
            description: CA certificate or PEM bundle path.
          clearCaCert:

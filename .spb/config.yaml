          useSystemCa:
            type: boolean
            description: Use the operating-system CA store for CLI HTTPS requests.
          filter:
            type: string
            description: Filter page sections or headings.
          llms:
            type: string
            description: Return nearest-ancestor llms data.
            enum:
            - index
            - full
          outline:
            type: boolean
            description: Return a heading outline.
          raw:
            type: boolean
            description: Return the response body.
          readTimeoutMs:
            type: integer
            description: HTTP read timeout in milliseconds.
          requireMd:
            type: boolean
            description: Require a Markdown response.
          url:
            type: string
            description: URL to read.
        required: []
        additionalProperties: false
    - name: mcp__agent_browser__agent_browser_snapshot

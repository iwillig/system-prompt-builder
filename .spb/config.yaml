            description: Isolated daemon namespace.
          restore:
            oneOf:
            - type: boolean
              description: Restore saved state.
            - type: string
              description: Named saved-state key.
          restoreCheckFn:
            type: string
            description: JavaScript expression that must be true after restore.
          restoreCheckText:
            type: string
            description: Text that restored page must contain.
          restoreCheckUrl:
            type: string
            description: URL pattern that restored page must match.
          restoreSave:
            type: string
            description: Saved-state policy.
            enum:
            - auto
            - always
            - never
          session:
            type: string
            description: Isolated browser session name.
          timeoutMs:
            type: integer
            description: Tool timeout in milliseconds.

              description: Restore saved state.
            - type: string
              description: Named saved-state key.
          restoreCheckFn:
            type: string
            description: JavaScript expression that must be true after restore.
          restoreCheckText:
            type: string
            description: Text that restored page must contain.
          restoreCheckUrl:
            type: string
            description: URL pattern that restored page must match.
          restoreSave:
            type: string
            description: Saved-state policy.
            enum:
            - auto
            - always
            - never
          session:
            type: string
            description: Isolated browser session name.
          timeoutMs:
            type: integer
            description: Tool timeout in milliseconds.
            minimum: 1
          useSystemCa:
            type: boolean
            description: Use the operating-system CA store for CLI HTTPS requests.
          headed:
            type: boolean
            description: Show the browser window.
          url:
            type: string
            description: URL to open.
          webgpu:
            type: boolean
            description: Enable WebGPU.
          webmcp:
            type: boolean
            description: Enable experimental WebMCP.
        required: []
        additionalProperties: false
    - name: mcp__agent_browser__agent_browser_read
      summary: Fetch or read the active browser page as text.
      parameters:
        type: object
        properties:
          allowedDomains:
            type: array
            description: Restrict traffic to these domains.
            items:

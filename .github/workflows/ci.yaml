name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv sync --dev
      - name: Install Just
        uses: extractions/setup-just@v2
      - name: Run CI
        run: just ci
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv sync --dev
      - name: Install Just
        uses: extractions/setup-just@v2
      - name: Build and validate distributions
        run: just package-check
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
